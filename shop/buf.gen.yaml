version: v2
inputs:
  - directory: api
plugins:
  - local: ["go", "run", "google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11"]
    out: api
    opt: paths=source_relative
    strategy: all
  - local: ["go", "run", "google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2"]
    out: api
    opt: paths=source_relative
    strategy: all
  - local: ["go", "run", "github.com/go-kratos/kratos/cmd/protoc-gen-go-http/v3@v3.0.0-20260526000039-30da04b769dc"]
    out: api
    opt: paths=source_relative
    strategy: all
  - local: ["go", "run", "github.com/go-kratos/kratos/cmd/protoc-gen-go-errors/v3@latest"]
    out: api
    opt: paths=source_relative
    strategy: all
  - local: ["go", "run", "github.com/envoyproxy/protoc-gen-validate@v1.3.3"]
    out: api
    opt: paths=source_relative,lang=go
    strategy: all
