syntax = "proto3";
package kratos.api;

option go_package = "github.com/go-kratos/kratos-layout/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Middleware middleware = 3;
}

// Middleware configures the cross-cutting transport middleware chain.
// Every switch is opt-in: an empty message installs no middleware.
message Middleware {
  // Per-middleware switches.
  bool logging = 1;
  bool recovery = 2;
  bool validate = 3;
  bool metadata = 4;
  bool ratelimit = 5;
  bool metrics = 6;
  bool tracing = 7;
  bool jwt = 8;
  bool circuit_breaker = 9;
  // Install jwt.Client on the outbound chain. Off by default: signing
  // credentials for downstream services is an explicit application decision.
  bool jwt_client = 10;

  // Prefixes propagated between service calls by the metadata middleware.
  repeated string propagated_prefix = 11;
  // Canonical RPC operations that bypass JWT auth, e.g.
  // "/todo.v1.TodoService/ListTodos". Not HTTP paths.
  repeated string public_operations = 12;
  // Signing key for inbound JWTs. Supply via ${JWT_SIGNING_KEY:} in
  // config.yaml; never commit a real key to version control.
  string jwt_signing_key = 13;
  // Names used for OpenTelemetry tracer and meter instruments.
  string tracer_name = 14;
  string meter_name = 15;
  // Maximum concurrent requests admitted by the application rate limiter.
  int64 rate_limit = 16;
  // Consecutive failures before a circuit breaker opens.
  int64 circuit_breaker_threshold = 17;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    // Driver name registered with database/sql, e.g. "mysql".
    string driver = 1;
    // Driver-specific DSN. Keep credentials out of version control.
    string source = 2;
    // Log every generated statement. Development only.
    bool debug = 3;
    // Create or update tables from the ent schema on startup. Leave false in
    // production and apply migrations as a separate, reviewed step.
    bool auto_migrate = 4;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
  }
  Database database = 1;
  Redis redis = 2;
}
