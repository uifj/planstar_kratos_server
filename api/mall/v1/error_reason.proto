syntax = "proto3";

package mall.v1;

option go_package = "github.com/go-kratos/kratos-layout/api/mall/v1;v1";
option java_multiple_files = true;
option java_package = "io.kratos.mall.v1";
option objc_class_prefix = "APIMallV1";

// ErrorReason enumerates the typed business errors surfaced by the mall.
// biz declares one Err<Resource><Cause> per value.
enum ErrorReason {
  MALL_UNSPECIFIED = 0;
  USER_NOT_FOUND = 1;
  USER_MOBILE_EXISTS = 2;
  USER_PASSWORD_INVALID = 3;
  USER_INVALID_ARGUMENT = 4;
  ADDRESS_NOT_FOUND = 5;
  GOODS_NOT_FOUND = 6;
  GOODS_SKU_NOT_FOUND = 7;
  GOODS_INVALID_ARGUMENT = 8;
  CART_NOT_FOUND = 9;
  ORDER_NOT_FOUND = 10;
  ORDER_PRICE_CHANGED = 11;
  ORDER_STATUS_CONFLICT = 12;
  ORDER_INVALID_ARGUMENT = 13;
  INVENTORY_NOT_ENOUGH = 14;
  PAYMENT_NOT_FOUND = 15;
  PAYMENT_AMOUNT_MISMATCH = 16;
  PAYMENT_STATUS_CONFLICT = 17;
  CAPTCHA_INVALID = 18;
  PERMISSION_DENIED = 19;
  CATEGORY_NOT_FOUND = 20;
  BRAND_NOT_FOUND = 21;
  TOKEN_INVALID = 22;
  INTERNAL_ERROR = 23;
}
