syntax = "proto3";

package mall.v1;

import "google/api/field_behavior.proto";

option go_package = "github.com/go-kratos/kratos-layout/api/mall/v1;v1";
option java_multiple_files = true;
option java_package = "io.kratos.mall.v1";
option java_outer_classname = "MallCommonProto";

// Common messages shared by ShopService and AdminService.
//
// The source kratos-shop project kept four drifting copies of these message
// definitions (two per BFF). This file merges every same-named message into a
// single superset so both services compile into one Go package without name
// collisions. Fields that existed in only one copy are kept here.
//
// All public ids are UUIDv7 strings. Business keys (order_sn, payment_no,
// goods_sn, sku_code, mobile, code, event_id) stay unique strings.

// OrderStatus is the lifecycle of an order. The numeric values are persisted
// in the orders.status column and are shared with biz.OrderStatus.
enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  // Created, waiting for the inventory lock result.
  ORDER_STATUS_PENDING = 1;
  // Inventory locked, waiting for payment.
  ORDER_STATUS_LOCKED = 2;
  // Paid, waiting for shipment.
  ORDER_STATUS_PAID = 3;
  // Shipped, waiting for receipt.
  ORDER_STATUS_SHIPPED = 4;
  // Completed.
  ORDER_STATUS_COMPLETED = 5;
  // Cancelled (inventory failure, user cancel, or pay timeout).
  ORDER_STATUS_CANCELLED = 6;
  // Refund in progress.
  ORDER_STATUS_REFUNDING = 7;
  // Refunded.
  ORDER_STATUS_REFUNDED = 8;
}

// PaymentStatus is the lifecycle of a payment record.
enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_PENDING = 1;
  PAYMENT_STATUS_SUCCESS = 2;
  PAYMENT_STATUS_FAILED = 3;
  PAYMENT_STATUS_REFUNDED = 4;
}

// ---------------------------------------------------------------------------
// User / auth
// ---------------------------------------------------------------------------

// RegisterReq is shared by the C-end and admin registration RPCs.
message RegisterReq {
  string mobile = 1 [(google.api.field_behavior) = REQUIRED];
  string username = 2 [(google.api.field_behavior) = REQUIRED];
  string password = 3 [(google.api.field_behavior) = REQUIRED];
  string captcha = 4;
  string captcha_id = 5;
}

// LoginReq is a superset: the C-end logs in with mobile + captcha, the admin
// BFF with username. password is the only field common to both.
message LoginReq {
  string mobile = 1;
  string username = 2;
  string password = 3 [(google.api.field_behavior) = REQUIRED];
  string captcha = 4;
  string captcha_id = 5;
}

// RegisterReply is returned by register, login and refresh-token.
message RegisterReply {
  string id = 1;
  string mobile = 3;
  string username = 4;
  string token = 5;
  int64 expired_at = 6;
}

message RefreshTokenRequest {
  string token = 1 [(google.api.field_behavior) = REQUIRED];
}

message CaptchaReply {
  string captcha_id = 1;
  // Base64-encoded PNG data URL. The C-end renders it directly.
  string pic_path = 2;
}

// UserDetailResponse is the admin superset (adds permissions).
message UserDetailResponse {
  string id = 1;
  string mobile = 2;
  string nick_name = 3;
  int64 birthday = 4;
  string gender = 5;
  int32 role = 6;
  repeated string permissions = 7;
}

// ---------------------------------------------------------------------------
// Address
// ---------------------------------------------------------------------------

message CreateAddressReq {
  // Ignored on input: the server derives the owner from the JWT claims.
  string uid = 1;
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  string mobile = 3 [(google.api.field_behavior) = REQUIRED];
  string province = 4 [(google.api.field_behavior) = REQUIRED];
  string city = 5 [(google.api.field_behavior) = REQUIRED];
  string districts = 6 [(google.api.field_behavior) = REQUIRED];
  string address = 7 [(google.api.field_behavior) = REQUIRED];
  string post_code = 8;
  int32 is_default = 9;
}

message UpdateAddressReq {
  string uid = 1;
  string name = 2;
  string mobile = 3;
  string province = 4;
  string city = 5;
  string districts = 6;
  string address = 7;
  string post_code = 8;
  int32 is_default = 9;
  string id = 10 [(google.api.field_behavior) = REQUIRED];
}

message AddressInfo {
  string id = 1;
  string name = 2;
  string mobile = 3;
  string province = 4;
  string city = 5;
  string districts = 6;
  string address = 7;
  string post_code = 8;
  int32 is_default = 9;
}

message ListAddressReq {
  string uid = 1;
}

message ListAddressReply {
  repeated AddressInfo results = 1;
}

message AddressReq {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string uid = 2;
}

message CheckResponse {
  bool success = 1;
}

// ---------------------------------------------------------------------------
// Goods
// ---------------------------------------------------------------------------

// GoodsListRequest is the admin superset (adds sku_code).
message GoodsListRequest {
  int32 page = 1;
  int32 page_size = 2;
  string keywords = 3;
  string category_id = 4;
  string brand_id = 5;
  string sku_code = 6;
}

// GoodsItem is the admin superset (adds category/brand names, sku count and
// sold count).
message GoodsItem {
  string id = 1;
  string name = 2;
  string goods_sn = 3;
  int64 market_price = 4;
  bool on_sale = 5;
  bool is_new = 6;
  bool is_hot = 7;
  string category_id = 8;
  string brand_id = 9;
  string category_name = 10;
  string brand_name = 11;
  int32 sku_count = 12;
  int64 sold_num = 13;
}

message GoodsListReply {
  int32 total = 1;
  repeated GoodsItem list = 2;
}

message GoodsDetailRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

// GoodsSkuDetail is the admin superset (adds bar_code).
message GoodsSkuDetail {
  string id = 1;
  string goods_id = 2;
  string sku_name = 3;
  string sku_code = 4;
  string bar_code = 5;
  int64 price = 6;
  int64 promotion_price = 7;
  int64 inventory = 8;
  bool on_sale = 9;
  string pic = 10;
}

// GoodsImageDetail is the admin superset (adds id).
message GoodsImageDetail {
  string id = 1;
  string url = 2;
  int32 position = 3;
  bool is_master = 4;
}

// GoodsDetailReply is the union of the C-end and admin detail shapes.
message GoodsDetailReply {
  string id = 1;
  string category_id = 2;
  string brand_id = 3;
  string type_id = 4;
  string name = 5;
  string goods_sn = 6;
  string goods_brief = 7;
  string goods_front_image = 8;
  repeated string goods_images = 9;
  int64 market_price = 10;
  bool on_sale = 11;
  bool ship_free = 12;
  bool is_new = 13;
  bool is_hot = 14;
  int64 sold_num = 15;
  string brand_name = 16;
  string category_name = 17;
  repeated GoodsSkuDetail skus = 18;
  repeated GoodsImageDetail images = 19;
}

// ---------------------------------------------------------------------------
// Cart
// ---------------------------------------------------------------------------

message CartListRequest {}

message CartItemReply {
  string id = 1;
  string user_id = 2;
  string goods_id = 3;
  string goods_sn = 4;
  string goods_name = 5;
  string sku_id = 6;
  int64 goods_price = 7;
  int32 goods_num = 8;
  bool is_select = 9;
}

message CartListReply {
  repeated CartItemReply list = 1;
}

message CartAddRequest {
  string goods_id = 1 [(google.api.field_behavior) = REQUIRED];
  string goods_sn = 2;
  string goods_name = 3;
  string sku_id = 4 [(google.api.field_behavior) = REQUIRED];
  int64 goods_price = 5;
  int32 goods_num = 6 [(google.api.field_behavior) = REQUIRED];
  bool is_select = 7;
}

message CartUpdateRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  int32 goods_num = 2 [(google.api.field_behavior) = REQUIRED];
}

message CartDeleteRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

// ---------------------------------------------------------------------------
// Order
// ---------------------------------------------------------------------------

message OrderCreateRequest {
  // Address id. The server reloads the snapshot from storage.
  string address = 1 [(google.api.field_behavior) = REQUIRED];
  repeated OrderCartItem cart_item = 2;
}

message OrderCartItem {
  string cart_id = 1;
  string sku_id = 2 [(google.api.field_behavior) = REQUIRED];
  int32 sku_num = 3 [(google.api.field_behavior) = REQUIRED];
}

// OrderInfoReply replaces both the C-end OrderInfoReply and the admin
// OrderInfo. OrderGoodsReply replaces OrderGoodsInfo (identical fields).
message OrderInfoReply {
  string id = 1;
  string user_id = 2;
  string order_sn = 3;
  int32 status = 4;
  string post = 5;
  int64 total = 6;
  string address = 7;
  string name = 8;
  string mobile = 9;
  string add_time = 10;
  repeated OrderGoodsReply goods = 11;
}

message OrderGoodsReply {
  string id = 1;
  string sku_id = 2;
  string sku_name = 3;
  int64 sku_price = 4;
  int32 num = 5;
  int64 total_price = 6;
}

// OrderListRequest is the admin superset (adds status).
message OrderListRequest {
  int32 page = 1;
  int32 page_size = 2;
  int32 status = 3;
}

message OrderListReply {
  int32 total = 1;
  repeated OrderInfoReply list = 2;
}

message OrderCancelRequest {
  string order_sn = 1 [(google.api.field_behavior) = REQUIRED];
}

message OrderDetailRequest {
  string order_sn = 1 [(google.api.field_behavior) = REQUIRED];
}

message ShipOrderRequest {
  string order_sn = 1 [(google.api.field_behavior) = REQUIRED];
  string post = 2 [(google.api.field_behavior) = REQUIRED];
}

message RefundOrderRequest {
  string order_sn = 1 [(google.api.field_behavior) = REQUIRED];
}

// ---------------------------------------------------------------------------
// Payment (local mock, no real channel)
// ---------------------------------------------------------------------------

message PaymentCreateRequest {
  string order_sn = 1 [(google.api.field_behavior) = REQUIRED];
  int64 amount = 2;
  string channel = 3;
}

message PaymentInfoReply {
  string id = 1;
  string payment_no = 2;
  string order_sn = 3;
  int64 amount = 4;
  string channel = 5;
  int32 status = 6;
}

message PaymentMockPayRequest {
  string payment_no = 1 [(google.api.field_behavior) = REQUIRED];
}

// ---------------------------------------------------------------------------
// Admin: goods management
// ---------------------------------------------------------------------------

message UpdateGoodsRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2;
  string name_alias = 3;
  string goods_brief = 4;
  string goods_front_image = 5;
  int64 market_price = 6;
  bool ship_free = 7;
  bool is_new = 8;
  bool is_hot = 9;
}

message DeleteGoodsRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message UpdateGoodsStatusRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  bool on_sale = 2;
}

message CreateGoodsRequest {
  string category_id = 1;
  string brand_id = 2;
  string type_id = 3;
  string name = 4 [(google.api.field_behavior) = REQUIRED];
  string goods_sn = 5 [(google.api.field_behavior) = REQUIRED];
  int64 market_price = 6;
  int64 inventory = 7;
  string goods_brief = 8;
  string goods_front_image = 9;
  bool ship_free = 10;
  bool is_new = 11;
  bool is_hot = 12;
  bool on_sale = 13;
  string sku_name = 14;
  string sku_code = 15;
  string bar_code = 16;
  int64 sku_price = 17;
  int64 promotion_price = 18;
  int64 sku_inventory = 19;
  string sku_image = 20;
}

// ---------------------------------------------------------------------------
// Admin: category / brand
// ---------------------------------------------------------------------------

message CategoryItem {
  string id = 1;
  string name = 2;
  string parent_category = 3;
  int32 level = 4;
}

message CategoryListReply {
  repeated CategoryItem list = 1;
}

message BrandListRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message BrandItem {
  string id = 1;
  string name = 2;
  string logo = 3;
}

message BrandListReply {
  repeated BrandItem list = 1;
}

message CategorySaveRequest {
  string id = 1;
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  string parent_category = 3;
  int32 level = 4;
  int32 sort = 5;
}

message CategoryDeleteRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

// ---------------------------------------------------------------------------
// Admin: user management
// ---------------------------------------------------------------------------

message UserListRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message UserInfo {
  string id = 1;
  string mobile = 2;
  string nick_name = 3;
  int64 birthday = 4;
  string gender = 5;
  int32 role = 6;
}

message UserListReply {
  int32 total = 1;
  repeated UserInfo list = 2;
}

message UserAddressListRequest {
  string uid = 1 [(google.api.field_behavior) = REQUIRED];
}

message UserAddressListReply {
  repeated AddressInfo list = 1;
}

message UserAddressDeleteRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string uid = 2;
}

// ---------------------------------------------------------------------------
// Admin: dashboard
// ---------------------------------------------------------------------------

message DashboardStatsReply {
  int64 total_orders = 1;
  int64 total_sales = 2;
  int64 today_orders = 3;
  int64 today_sales = 4;
  int64 total_users = 5;
  repeated StatusCount status_counts = 6;
  repeated DailySales last30_days = 7;
  repeated TopGoods top_goods = 8;
}

message StatusCount {
  int32 status = 1;
  int64 count = 2;
}

message DailySales {
  string date = 1;
  int64 order_count = 2;
  int64 amount = 3;
}

message TopGoods {
  string sku_id = 1;
  string sku_name = 2;
  int64 num = 3;
  int64 amount = 4;
}

// ---------------------------------------------------------------------------
// Admin: RBAC
// ---------------------------------------------------------------------------

message PermissionItem {
  string id = 1;
  string code = 2;
  string name = 3;
  string group_name = 4;
  int32 sort = 5;
}

message PermissionListReply {
  repeated PermissionItem list = 1;
}

message RolePermissionListRequest {
  int32 role = 1;
}

message RolePermissionListReply {
  repeated string codes = 1;
}

message RolePermissionUpdateRequest {
  int32 role = 1;
  repeated string codes = 2;
}
