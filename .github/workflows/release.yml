# Release：push tag v*.*.* -> 构建推送镜像(Packages) -> 创建 GitHub Release -> 部署(Deployments)
#
# 触发：
#   git tag v0.1.0 && git push origin v0.1.0
#
# 部署所需 Secrets（缺失则自动跳过部署）：
#   SERVER_HOST / SERVER_USER / SERVER_SSH_KEY / SERVER_PORT / APP_DIR / GHCR_TOKEN
# 部署档位（可选仓库变量）：
#   PLANSTAR_LITE=1  低配档位（4C8G，叠加 docker-compose.lite.yml + config.lite.yaml）
#   未设置或为空     全量档位（COMPOSE_PROFILES=full + config.prod.yaml）
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "发布版本号（如 v0.1.0）"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/planstar-api
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build, push image and create release
    runs-on: ubuntu-latest
    permissions:
      contents: write    # 创建 GitHub Release
      packages: write    # 推送镜像到 GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(env.RELEASE_TAG, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./planstar
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}

  deploy:
    name: Deploy release to server
    needs: release
    runs-on: ubuntu-latest
    # 部署前置条件只看仓库变量（secrets 不可用于 job 级 if 表达式）
    if: ${{ vars.SERVER_HOST != '' }}
    env:
      PLANSTAR_LITE: ${{ vars.PLANSTAR_LITE }}
    permissions:
      contents: read
      packages: read
      deployments: write
    # 记录到 GitHub Deployments 面板（Environment）
    environment:
      name: production
      url: http://${{ vars.SERVER_HOST || 'localhost' }}:8098
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST || vars.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          envs: PLANSTAR_LITE
          script: |
            set -euo pipefail
            cd "${{ secrets.APP_DIR }}"
            git fetch --tags --force
            git checkout "${{ env.RELEASE_TAG }}"
            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            fi

            # 按档位选择编排文件：低配不启动 ES/MQ/Consul 等重组件
            if [ "${PLANSTAR_LITE:-0}" = "1" ]; then
              export PLANSTAR_CONFIG_FILE=config.lite.yaml
              FILES="-f planstar/docker-compose.yml -f planstar/docker-compose.lite.yml"
              PROFILES=""
            else
              export PLANSTAR_CONFIG_FILE=config.prod.yaml
              FILES="-f planstar/docker-compose.yml"
              PROFILES="full"
            fi

            export PLANSTAR_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            export PLANSTAR_TAG=${{ env.RELEASE_TAG }}
            export COMPOSE_PROFILES="${PROFILES}"

            # 先校验再切换，避免半套配置上线
            docker compose ${FILES} config -q
            docker compose ${FILES} pull planstar-api admin admin-web
            docker compose ${FILES} up -d --remove-orphans
            docker compose ${FILES} ps

            # 部署后自检：就绪探针失败则 job 失败，便于及时人工回滚
            for i in $(seq 1 30); do
              curl -fsS http://127.0.0.1:9108/healthz >/dev/null 2>&1 && break
              sleep 2
            done
            curl -fsS http://127.0.0.1:9108/readyz >/dev/null