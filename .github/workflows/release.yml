# Release：push tag v*.*.* -> 构建推送镜像(Packages) -> 创建 GitHub Release -> 部署(Deployments)
#
# 触发：
#   git tag v0.1.0 && git push origin v0.1.0
#
# 部署所需 Secrets（缺失则自动跳过部署）：
#   SERVER_HOST / SERVER_USER / SERVER_SSH_KEY / SERVER_PORT / APP_DIR / GHCR_TOKEN
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "发布版本号（如 v0.1.0）"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/planstar-api
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build, push image and create release
    runs-on: ubuntu-latest
    permissions:
      contents: write    # 创建 GitHub Release
      packages: write    # 推送镜像到 GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(env.RELEASE_TAG, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./planstar
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}

  deploy:
    name: Deploy release to server
    needs: release
    runs-on: ubuntu-latest
    if: ${{ vars.SERVER_HOST != '' || secrets.SERVER_HOST != '' }}
    permissions:
      contents: read
      packages: read
      deployments: write
    # 记录到 GitHub Deployments 面板（Environment）
    environment:
      name: production
      url: http://${{ secrets.SERVER_HOST || 'localhost' }}:8098
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            set -e
            cd "${{ secrets.APP_DIR }}"
            git fetch --tags --force
            git checkout "${{ env.RELEASE_TAG }}"
            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            fi
            export PLANSTAR_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            export PLANSTAR_TAG=${{ env.RELEASE_TAG }}
            docker compose -f planstar/docker-compose.yml pull
            docker compose -f planstar/docker-compose.yml up -d --remove-orphans
            docker compose -f planstar/docker-compose.yml ps