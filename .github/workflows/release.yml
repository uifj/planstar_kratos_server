# Release：push tag v*.*.* -> 构建推送镜像(Packages) -> 创建 GitHub Release -> 部署(Deployments)
#
# 触发：
#   git tag v0.1.0 && git push origin v0.1.0
#
# 部署所需 Secrets（缺失则自动跳过部署）：
#   SERVER_HOST / SERVER_USER / SERVER_SSH_KEY / SERVER_PORT / APP_DIR / GHCR_TOKEN
# 部署档位（可选仓库变量）：
#   PLANSTAR_LITE=1  低配档位（4C8G，叠加 docker-compose.lite.yml + config.lite.yaml）
#   未设置或为空     全量档位（COMPOSE_PROFILES=full + config.prod.yaml）
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "发布版本号（如 v0.1.0）"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/planstar-api
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build, push image and create release
    runs-on: ubuntu-latest
    permissions:
      contents: write    # 创建 GitHub Release
      packages: write    # 推送镜像到 GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(env.RELEASE_TAG, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./planstar
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}

  deploy:
    name: Deploy release to server
    needs: release
    runs-on: ubuntu-latest
    # 部署前置条件只看仓库变量（secrets 不可用于 job 级 if 表达式）
    if: ${{ vars.SERVER_HOST != '' }}
    env:
      # 生产部署固定使用 4C8G 低配档位 + docker-compose.prod.yml
      PLANSTAR_CONFIG_FILE: config.lite.yaml
    permissions:
      contents: read
      packages: read
      deployments: write
    # 记录到 GitHub Deployments 面板（Environment）
    environment:
      name: production
      url: http://${{ vars.SERVER_HOST || 'localhost' }}:8098
    steps:
      # 【安全整改】workflow_dispatch 的 tag 是自由文本，禁止直接把
      # ${{ ... }} 表达式插入远程 shell（可构造 `v1"; <命令>; #` 造成 RCE）。
      # 先在 runner 侧用白名单正则校验，再经 envs 以环境变量传给远端。
      - name: Validate release tag
        shell: bash
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "Invalid release tag: $RAW_TAG" >&2
            exit 1
          fi
          echo "DEPLOY_TAG=$RAW_TAG" >> "$GITHUB_ENV"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_APP_DIR: ${{ secrets.APP_DIR }}
          DEPLOY_ACTOR: ${{ github.actor }}
          DEPLOY_REGISTRY: ${{ env.REGISTRY }}
          DEPLOY_IMAGE_NAME: ${{ env.IMAGE_NAME }}
          GHCR_TOKEN_VALUE: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST || vars.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          envs: DEPLOY_TAG,DEPLOY_APP_DIR,DEPLOY_ACTOR,DEPLOY_REGISTRY,DEPLOY_IMAGE_NAME,GHCR_TOKEN_VALUE
          script: |
            set -euo pipefail
            : "${DEPLOY_TAG:?}"
            : "${DEPLOY_APP_DIR:?}"
            # 远端二次校验：防止 runner 与远端之间任何传递环节被篡改
            if [[ ! "$DEPLOY_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
              echo "invalid deploy tag" >&2; exit 1
            fi
            cd "${DEPLOY_APP_DIR}"
            git fetch --tags --force
            git checkout "${DEPLOY_TAG}"
            if [ -n "${GHCR_TOKEN_VALUE:-}" ]; then
              printf '%s' "${GHCR_TOKEN_VALUE}" | docker login ghcr.io -u "${DEPLOY_ACTOR}" --password-stdin
            fi

            # 生产档位：4C8G/2M 单机，config.lite.yaml + prod overlay + .env.prod
            export PLANSTAR_CONFIG_FILE=config.lite.yaml
            export COMPOSE_DIR="${DEPLOY_APP_DIR}/planstar"
            export ENV_FILE=.env.prod

            # Prometheus 抓取 9108/metrics 需要 Bearer 令牌，从服务器本地 .env.prod 落盘
            OPS_TOKEN="$(grep -E '^PLANSTAR_OPS_TOKEN=' planstar/.env.prod | tail -1 | cut -d= -f2-)"
            [ -n "${OPS_TOKEN}" ] || { echo "missing PLANSTAR_OPS_TOKEN in .env.prod" >&2; exit 1; }
            ( umask 077; printf '%s' "${OPS_TOKEN}" > planstar/deploy/prometheus/ops_token )
            chmod 600 planstar/deploy/prometheus/ops_token

            COMPOSE="docker compose --env-file planstar/.env.prod -f planstar/docker-compose.yml -f planstar/docker-compose.prod.yml"
            # 部署侧覆盖（例如运行时关闭不兼容的 OSS）存在即叠加。
            if [ -f planstar/docker-compose.server.yml ]; then
              COMPOSE="${COMPOSE} -f planstar/docker-compose.server.yml"
            fi

            # 先跑发布前门禁，再切换，避免半套配置或测试口令上线
            ./planstar/deploy/preflight.sh
            ${COMPOSE} config -q
            ${COMPOSE} pull planstar-api admin admin-web
            ${COMPOSE} up -d --remove-orphans
            ${COMPOSE} ps

            # 部署后自检：就绪探针失败则 job 失败，便于及时人工回滚
            for i in $(seq 1 30); do
              curl -fsS http://127.0.0.1:9108/healthz >/dev/null 2>&1 && break
              sleep 2
            done
            curl -fsS http://127.0.0.1:9108/readyz >/dev/null