# CI：push / PR 时覆盖后端 Go、接口契约、Flutter 前端与 compose 配置校验
name: CI

on:
  push:
    branches: [main]
    paths:
      - "planstar/**"
      - "admin/**"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "planstar/**"
      - "admin/**"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"

jobs:
  go:
    name: Go Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: planstar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: planstar/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test -race ./...

  admin-go:
    name: Admin Go Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    env:
      GOPROXY: https://goproxy.cn,direct
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: admin/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  admin-console:
    name: Admin Console Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin/console
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/console/package-lock.json

      - name: Configure npm registry
        run: npm config set registry https://repo.huaweicloud.com/repository/npm/

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  contract:
    name: API Contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: planstar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: planstar/go.sum

      - name: Contract test
        run: go test ./internal/server -run 'TestContract|TestRoutesMatchContract' -count=1 -v

  compose:
    name: Compose Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker compose config
        run: docker compose -f planstar/docker-compose.yml config -q

      - name: Validate local compose
        run: docker compose -f planstar/docker-compose.local.yml config -q

  observability-config:
    name: Observability Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Prometheus rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/planstar/deploy/prometheus/rules:/rules" \
            prom/prometheus:v2.53.0 \
            check rules /rules/alerts.yml

      - name: Validate Grafana dashboards JSON
        run: |
          python3 - <<'PY'
          import glob
          import json
          import sys

          files = sorted(glob.glob("planstar/deploy/grafana/dashboards/*.json"))
          if not files:
              sys.exit("no Grafana dashboard JSON found")
          for path in files:
              with open(path, encoding="utf-8") as fh:
                  json.load(fh)
              print(f"dashboard ok: {path}")
          PY

      - name: Render and check Alertmanager config
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          template = pathlib.Path(
              "planstar/deploy/alertmanager/alertmanager.yml"
          ).read_text(encoding="utf-8")
          dummy = {
              "AM_SMTP_SMARTHOST": "smtp.example.com:587",
              "AM_SMTP_FROM": "planstar-alert@example.com",
              "AM_SMTP_AUTH_USERNAME": "alert@example.com",
              "AM_SMTP_AUTH_PASSWORD": "ci-dummy-password",
              "AM_ALERT_EMAIL_TO": "ops@example.com",
          }

          def replace(match):
              key = match.group(1)
              if key not in dummy:
                  sys.exit(f"alertmanager template references unknown env: {key}")
              return dummy[key]

          rendered = re.sub(r"\$\{([A-Z0-9_]+)\}", replace, template)
          pathlib.Path("/tmp/alertmanager.yml").write_text(rendered, encoding="utf-8")
          print("rendered alertmanager config")
          PY
          docker run --rm --entrypoint amtool \
            -v "/tmp/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            prom/alertmanager:v0.27.0 \
            check-config /etc/alertmanager/alertmanager.yml

      - name: Validate docker compose config
        run: docker compose -f planstar/docker-compose.yml config -q
