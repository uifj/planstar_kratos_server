# CI：push / PR 时覆盖后端 Go、接口契约、Flutter 前端与 compose 配置校验
name: CI

on:
  push:
    branches: [main]
    paths:
      - "planstar/**"
      - "docs/api/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "planstar/**"
      - "docs/api/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"

jobs:
  go:
    name: Go Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: planstar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: planstar/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test -race ./...

  contract:
    name: API Contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: planstar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: planstar/go.sum

      - name: Contract test
        run: go test ./internal/server -run 'TestContract|TestRoutesMatchContract' -count=1 -v

  compose:
    name: Compose Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker compose config
        run: docker compose -f planstar/docker-compose.yml config -q
