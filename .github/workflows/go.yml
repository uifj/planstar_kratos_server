# Planstar CI：构建 / 静态检查 / 单测
#
# 说明：仓库根目录是历史 kratos-layout 模板（已归档，无 Go 包）；真实服务在
# planstar/ 独立模块中，因此 CI 需进入该目录执行。根目录 go.yml 旧配置会因
# “./... matched no packages” 与 Go 版本不匹配而失败。
name: Planstar CI

on:
  push:
    branches: [main]
    paths:
      - "planstar/**"
      - ".github/workflows/go.yml"
  pull_request:
    branches: [main]
    paths:
      - "planstar/**"

defaults:
  run:
    working-directory: planstar

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: planstar/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...