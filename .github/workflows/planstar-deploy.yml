# Planstar 持续交付：push 到 main -> 测试 -> 构建镜像 -> 推送 GHCR -> SSH 部署
# PR 仅执行测试（不构建镜像、不部署）。
#
# 需在仓库 Settings -> Secrets and variables 配置（部署用）：
#   SERVER_HOST / SERVER_USER / SERVER_SSH_KEY / SERVER_PORT / APP_DIR
#   GHCR_TOKEN（私有镜像拉取，可选）
name: planstar-deploy

on:
  push:
    branches: [main]
    paths:
      - "planstar/**"
      - ".github/workflows/planstar-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "planstar/**"
      - ".github/workflows/planstar-deploy.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/planstar-api

defaults:
  run:
    working-directory: planstar

jobs:
  test:
    name: Test (build / vet / unit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: planstar/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build-push:
    name: Build & push image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./planstar
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build-push
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && (vars.SERVER_HOST != '' || secrets.SERVER_HOST != '')
    permissions:
      contents: read
      packages: read
      deployments: write
    # 记录到 GitHub Deployments 面板（Environment）
    environment:
      name: production
      url: http://${{ secrets.SERVER_HOST || 'localhost' }}:8098
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            set -e
            cd "${{ secrets.APP_DIR }}"
            # 以远端 main 为准重建工作区，兼容此前 release 部署导致的 detached HEAD
            git fetch origin main
            git checkout -B main origin/main
            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            fi
            export PLANSTAR_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            export PLANSTAR_TAG=main
            docker compose -f planstar/docker-compose.yml pull
            docker compose -f planstar/docker-compose.yml up -d --remove-orphans
            docker compose -f planstar/docker-compose.yml ps