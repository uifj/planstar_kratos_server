version: 2
updates:
  # Go 模块（planstar 独立模块）
  # minor/patch 合到一个 PR，避免刷屏；major 单独提但总量受 limit 约束
  - package-ecosystem: "gomod"
    directory: "/planstar"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions：全部合并为一个 PR
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"

  # 容器镜像（Dockerfile）：合并为一个 PR
  - package-ecosystem: "docker"
    directory: "/planstar"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker:
        patterns:
          - "*"
