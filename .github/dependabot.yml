version: 2
updates:
  # Go 模块（planstar 独立模块）
  - package-ecosystem: "gomod"
    directory: "/planstar"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"

  # 容器镜像（Dockerfile）
  - package-ecosystem: "docker"
    directory: "/planstar"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"