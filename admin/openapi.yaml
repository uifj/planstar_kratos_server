components:
    schemas:
        kratos.admin.v1.Admin:
            type: object
            properties:
                id:
                    type: string
                    description: The unique ID of the user, a UUID assigned by the server.
                name:
                    type: string
                    description: The name of the user.
                email:
                    type: string
                    description: The email of the user.
                avatar:
                    type: string
                    description: The avatar URL of the user.
                access:
                    type: string
                    description: |-
                        The access level of the user.
                         Possible values are: "admin", "user", etc.
                password:
                    type: string
                    description: The password of the user.
                status:
                    type: integer
                    description: The lifecycle status of the user.
                    format: enum
                createdAt:
                    type: string
                    description: The timestamp at which the user was created.
                    format: date-time
                updatedAt:
                    type: string
                    description: The latest timestamp at which the user was updated.
                    format: date-time
                mustChangePassword:
                    type: boolean
                    description: |-
                        Whether the admin must change the password before using the console. Set
                         for seeded or reset accounts; cleared by ChangePassword.
            description: Admin is the admin message.
        kratos.admin.v1.AdminSet:
            type: object
            properties:
                admins:
                    type: array
                    items:
                        $ref: '#/components/schemas/kratos.admin.v1.Admin'
                    description: The set of admins.
                nextPageToken:
                    type: string
                    description: The next page token.
            description: AdminSet is the set of admins.
        kratos.admin.v1.ChangePasswordRequest:
            required:
                - oldPassword
                - newPassword
            type: object
            properties:
                oldPassword:
                    type: string
                    description: Required. The current password, verified before the update.
                newPassword:
                    type: string
                    description: Required. The new password, at least 8 characters.
            description: ChangePasswordRequest is the request message for the ChangePassword method.
        kratos.admin.v1.LoginRequest:
            required:
                - password
            type: object
            properties:
                password:
                    type: string
                    description: Required. Password of the user.
                username:
                    type: string
                    description: Required. Exactly one of username/email must be set.
                email:
                    type: string
            description: LoginRequest is the request message for the Login method.
        planstar.admin.v1.BlacklistHit:
            type: object
            properties:
                rule:
                    type: string
                    description: Rule name, e.g. 金融集资 / 空气企划.
                keyword:
                    type: string
                    description: Matched keyword or missing field name.
            description: BlacklistHit is one category-blacklist match reported by the ops service.
        planstar.admin.v1.HandleReportRequest:
            type: object
            properties:
                id:
                    type: string
                    description: Required. Business report ID.
                status:
                    type: string
                    description: Required. accepted or rejected.
                note:
                    type: string
                    description: Optional. Resolution note; the ops service fills a default when empty.
            description: HandleReportRequest is the request for HandleReport.
        planstar.admin.v1.Order:
            type: object
            properties:
                id:
                    type: string
                    description: Business order ID (order_info.order_id).
                orderNo:
                    type: string
                    description: Order number (order_info.order_number).
                userId:
                    type: string
                amount:
                    type: string
                    description: Paid amount in cents (order_info.pay_amount).
                status:
                    type: integer
                    description: Order status (order_info.status, see dict_enum.OrderStatus).
                    format: int32
                createdAt:
                    type: string
                    format: date-time
            description: Order is a unified order (planstar_order.order_info).
        planstar.admin.v1.OrderSet:
            type: object
            properties:
                orders:
                    type: array
                    items:
                        $ref: '#/components/schemas/planstar.admin.v1.Order'
                nextPageToken:
                    type: string
            description: OrderSet is a page of orders.
        planstar.admin.v1.Project:
            type: object
            properties:
                id:
                    type: string
                    description: Business project ID (project.project_id).
                title:
                    type: string
                subtitle:
                    type: string
                categoryId:
                    type: string
                    description: Primary category ID (project.category_id).
                categoryName:
                    type: string
                    description: Category name resolved from project_category.name.
                publishStatus:
                    type: integer
                    description: 'Publish status: 0 draft, 1 published, 2 under review, 3 rejected.'
                    format: int32
                fundingStatus:
                    type: string
                    description: 'Funding status: preheating/ongoing/achieved/delivered/failed.'
                goalAmount:
                    type: string
                    description: Goal amount in cents.
                achievementPermille:
                    type: integer
                    description: Raised amount / goal amount in permille; 0 when the goal is unset.
                    format: int32
                supporterCount:
                    type: integer
                    format: int32
                creatorName:
                    type: string
                    description: Creator display name from creator_profile.display_name.
                createdAt:
                    type: string
                    format: date-time
            description: Project is a catalog project (planstar_catalog.project).
        planstar.admin.v1.ProjectSet:
            type: object
            properties:
                projects:
                    type: array
                    items:
                        $ref: '#/components/schemas/planstar.admin.v1.Project'
                nextPageToken:
                    type: string
            description: ProjectSet is a page of projects.
        planstar.admin.v1.Report:
            type: object
            properties:
                id:
                    type: string
                    description: Business report ID (project_report.report_id).
                targetType:
                    type: string
                targetId:
                    type: string
                projectId:
                    type: string
                userId:
                    type: string
                reasonCode:
                    type: string
                description:
                    type: string
                evidence:
                    type: array
                    items:
                        type: string
                status:
                    type: string
                    description: pending / accepted / rejected.
                handleNote:
                    type: string
                handleTime:
                    type: string
                    format: date-time
                createdAt:
                    type: string
                    format: date-time
            description: Report is a moderation report (planstar_catalog.project_report).
        planstar.admin.v1.ReportSet:
            type: object
            properties:
                reports:
                    type: array
                    items:
                        $ref: '#/components/schemas/planstar.admin.v1.Report'
                nextPageToken:
                    type: string
            description: ReportSet is a page of reports.
        planstar.admin.v1.ReviewProjectReply:
            type: object
            properties:
                project:
                    allOf:
                        - $ref: '#/components/schemas/planstar.admin.v1.Project'
                    description: Project view after the review.
                hits:
                    type: array
                    items:
                        $ref: '#/components/schemas/planstar.admin.v1.BlacklistHit'
                    description: Blacklist matches; populated by the ops service on success.
                blocked:
                    type: boolean
                    description: Whether the project is blocked by the blacklist.
            description: ReviewProjectReply is the result of a project review.
        planstar.admin.v1.ReviewProjectRequest:
            type: object
            properties:
                id:
                    type: string
                    description: Required. Business project ID.
                decision:
                    type: string
                    description: Required. approve or reject.
            description: ReviewProjectRequest is the request for ReviewProject.
        planstar.admin.v1.UpdateUserStatusRequest:
            type: object
            properties:
                id:
                    type: string
                    description: Required. Business user ID.
                status:
                    type: integer
                    description: Required. New account status (user_info.status semantics).
                    format: int32
            description: UpdateUserStatusRequest is the request for UpdateUserStatus.
        planstar.admin.v1.User:
            type: object
            properties:
                id:
                    type: string
                    description: Business user ID (user_info.user_id).
                name:
                    type: string
                    description: Display name (user_info.user_name).
                mobile:
                    type: string
                    description: Mobile number (user_info.mobile_no).
                avatar:
                    type: string
                    description: Avatar URL (user_info.avatar).
                status:
                    type: integer
                    description: Account status, same semantics as user_info.status.
                    format: int32
                createdAt:
                    type: string
                    description: Creation time (user_info.gmt_create).
                    format: date-time
                updatedAt:
                    type: string
                    description: Last update time (user_info.gmt_modified).
                    format: date-time
            description: User is a business user of the Planstar platform (planstar_user.user_info).
        planstar.admin.v1.UserSet:
            type: object
            properties:
                users:
                    type: array
                    items:
                        $ref: '#/components/schemas/planstar.admin.v1.User'
                nextPageToken:
                    type: string
                    description: Token for the next page; empty when there are no more rows.
            description: UserSet is a page of users.
tags:
    - name: AdminService
      description: AdminService is the admin service definition.
    - name: ConsoleService
      description: ConsoleService exposes read-mostly business management APIs for the console.
