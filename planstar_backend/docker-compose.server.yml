# =====================================================================
# 部署侧追加覆盖（叠加在 docker-compose.prod.yml 之后）
#   用法：docker compose --env-file .env.prod \
#           -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.server.yml up -d
#
# 对象存储：已启用火山引擎 TOS（provider=tos），由 docker-compose.prod.yml
#   从 .env.prod 的 PLANSTAR_STORAGE_OSS_* 注入，本文件不再覆盖。
# =====================================================================

name: planstar

services:
  planstar-api:
    # 生产业务端口只发布到回环，HTTPS 由 Traefik 终止后转发（PRODUCTION_AUDIT S4）。
    # 禁止 8098 公网明文直连：那会绕过 TLS，并以明文传输 30 天有效的 psSession Cookie。
    ports:
      - "127.0.0.1:8098:8098"
