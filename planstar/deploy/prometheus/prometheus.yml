# Planstar 单机 Prometheus 配置（对齐 deploy/ 的可观测栈）
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: prod

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: planstar-api
    metrics_path: /metrics
    static_configs:
      - targets: ["planstar-api:9108"]

  - job_name: mysql
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: consul
    metrics_path: /v1/agent/metrics
    static_configs:
      - targets: ["consul:8500"]