# Planstar 单机 Prometheus 配置（对齐 deploy/ 的可观测栈）
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: prod

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # 运维端口 9108 的 /metrics 需要 Bearer 鉴权。
  # 令牌由 deploy.sh 从 $PLANSTAR_OPS_TOKEN 写入 deploy/prometheus/ops_token
  # （bind mount 到 /etc/prometheus/ops_token，权限 0600）。Prometheus 不支持
  # 在配置里展开环境变量，因此使用 credentials_file。
  - job_name: planstar-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/ops_token
    static_configs:
      - targets: ["planstar-api:9108"]

  # 管理后台运维端口 9110：/metrics 匿名暴露在本机回环/容器网络。
  # 指标名由 admin/internal/server/metrics.go 定义：requests_total、
  # duration_seconds；用 job/service 标签与 planstar-api 隔离。
  - job_name: admin
    metrics_path: /metrics
    static_configs:
      - targets: ["admin:9110"]
        labels:
          service: admin.api

  # OTel Collector 的 Prometheus exporter（collector.yaml 中 prometheus exporter
  # 监听 0.0.0.0:8889）。用于确认 OTLP 接收与导出链路自身健康。
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: mysql
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: consul
    metrics_path: /v1/agent/metrics
    static_configs:
      - targets: ["consul:8500"]
