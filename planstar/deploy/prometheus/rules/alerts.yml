# =====================================================================
# Planstar 告警规则
#
# 阈值集中说明（PromQL 不支持变量，修改阈值时请同步修改下方表达式）：
#   服务存活       up{job="planstar-api"} == 0                 持续 2m   critical
#   就绪探针       planstar_ops_probe_status{probe="readyz"}==0 持续 3m   critical
#   5xx 比例       > 5%  持续 10m warning / > 10% 持续 5m critical
#   P95 延迟       > 2s  持续 10m warning
#   在途请求       > 50  持续 5m  warning
#   429 速率       > 1/s 持续 10m warning
#   下单失败比例   > 20% 持续 10m warning
#   ES 回退速率    > 0.5/s 持续 10m warning
#   DB 连接使用率  > 80% 持续 10m warning
#   Ops 鉴权失败   > 1/s 持续 10m warning
#   基础设施下线   up{job=~"mysql|redis|consul"} == 0 持续 2m critical
#
# 排障入口：docs/operations.md（健康检查语义、关键指标、常见故障处置）。
# =====================================================================
groups:
  # -------------------------------------------------------------------
  # 服务可用性：进程是否可抓取 + 就绪探针是否通过
  # -------------------------------------------------------------------
  - name: planstar-service
    rules:
      - alert: PlanstarServiceDown
        expr: up{job="planstar-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "planstar-api 已下线（Prometheus 抓取失败）"
          description: >-
            Prometheus 连续 2 分钟无法抓取 job=planstar-api（9108/metrics）。
            先确认容器状态与进程日志：docker compose ps planstar-api；
            docker compose logs --tail=200 planstar-api。
            注意 /metrics 需要 Bearer 令牌，若 deploy/prometheus/ops_token 为空
            也会表现为抓取失败（HTTP 401），请先核对令牌再判断进程存活。

      - alert: PlanstarReadinessFailing
        expr: planstar_ops_probe_status{probe="readyz"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "planstar-api 就绪检查失败（{{ $labels.check }}）"
          description: >-
            /readyz 中检查项 {{ $labels.check }} 连续 3 分钟失败。
            按 docs/operations.md 5.x 排查对应依赖（MySQL/Redis/Elasticsearch），
            并查看应用日志中的 readiness check failed。

  # -------------------------------------------------------------------
  # RED 指标：错误率、延迟、并发、限流
  # -------------------------------------------------------------------
  - name: planstar-red
    rules:
      - alert: PlanstarHighErrorRate5xx
        expr: >-
          sum(rate(planstar_http_requests_total{job="planstar-api",status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(planstar_http_requests_total{job="planstar-api"}[5m])), 0.001)
          > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "planstar-api 5xx 比例超过 5%"
          description: >-
            最近 5 分钟 5xx 占比高于 5%，已持续 10 分钟。
            先看 Grafana「Planstar Ops / RED」定位 route 与状态码，再检索
            Loki 中的 request failed / panic recovered；同时确认 /readyz 是否 503。

      - alert: PlanstarCriticalErrorRate5xx
        expr: >-
          sum(rate(planstar_http_requests_total{job="planstar-api",status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(planstar_http_requests_total{job="planstar-api"}[5m])), 0.001)
          > 0.10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "planstar-api 5xx 比例超过 10%（critical）"
          description: >-
            最近 5 分钟 5xx 占比高于 10%，已持续 5 分钟，用户侧已明显受损。
            立即检查 /readyz、MySQL/Redis/ES 依赖与最近一次发布；必要时按
            docs/operations.md 常见故障处置回滚。

      - alert: PlanstarHighLatencyP95
        expr: >-
          histogram_quantile(0.95,
            sum by (le) (rate(planstar_http_request_duration_seconds_bucket{job="planstar-api"}[5m]))
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "planstar-api P95 延迟超过 2s"
          description: >-
            全局 P95 延迟连续 10 分钟高于 2s。结合 Grafana 延迟分位图定位
            route，检查慢 SQL、ES 查询、Redis 阻塞与下游超时（请求总超时 15s）。

      - alert: PlanstarInflightSaturation
        expr: sum(planstar_http_requests_in_flight{job="planstar-api"}) > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "planstar-api 在途请求超过 50"
          description: >-
            在途请求连续 5 分钟高于 50，说明处理能力不足或下游阻塞。
            查看 Grafana in-flight 曲线、P95 延迟与 goroutine 数，确认是否存在
            慢查询/连接池耗尽或突发流量。

      - alert: PlanstarRateLimitSpike
        expr: sum(rate(planstar_http_requests_total{job="planstar-api",status="429"}[5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "planstar-api 429 限流速率超过 1/s"
          description: >-
            429 持续 10 分钟超过 1/s，可能是刷发码/登录接口或客户端重试风暴。
            检索日志 "send code rate limited" 中的 mobile/ip/dimension，
            必要时在网关层临时封禁来源 IP。

  # -------------------------------------------------------------------
  # 业务漏斗：下单失败与 ES 降级
  # -------------------------------------------------------------------
  - name: planstar-business
    rules:
      - alert: PlanstarOrderFailureRate
        expr: >-
          sum(rate(planstar_biz_order_created_total{job="planstar-api",result!="success"}[5m]))
          /
          clamp_min(sum(rate(planstar_biz_order_created_total{job="planstar-api"}[5m])), 0.001)
          > 0.20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "planstar-api 下单失败率超过 20%"
          description: >-
            下单失败比例连续 10 分钟超过 20%。按 result 标签（price_changed /
            sold_out / limit_exceeded / quote_expired / error）区分业务原因；
            error 占比高时优先检查 MySQL 写入与 MQ 发布，业务原因集中时同步产品侧。

      - alert: PlanstarESFallbackSpike
        expr: sum(rate(planstar_catalog_es_fallback_total{job="planstar-api"}[5m])) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Elasticsearch 回退 MySQL 速率超过 0.5/s"
          description: >-
            目录查询持续回退 MySQL，说明 ES 查询失败或不可用。检查
            curl -fsS http://<host>:9200/_cluster/health?pretty 的 status、磁盘水位、
            JVM 堆，并检索日志 "fallback to mysql" 确认错误原因。

  # -------------------------------------------------------------------
  # 依赖健康：数据库连接池与基础设施 exporter
  # -------------------------------------------------------------------
  - name: planstar-dependencies
    rules:
      - alert: PlanstarDBConnectionSaturation
        expr: >-
          max by (domain) (planstar_db_connections{job="planstar-api",state="in_use"})
          /
          max by (domain) (planstar_db_connections{job="planstar-api",state="max"})
          > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "planstar 数据库 {{ $labels.domain }} 连接池使用率超过 80%"
          description: >-
            {{ $labels.domain }} 的连接使用率连续 10 分钟超过 80%。检查是否存在
            慢查询、长事务或连接泄漏（planstar_db_wait_count_total 增长），
            必要时临时调大连接池上限或重启泄漏实例。

      - alert: PlanstarInfraDown
        expr: up{job=~"mysql|redis|consul"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "基础设施 {{ $labels.job }} 已下线"
          description: >-
            Prometheus 连续 2 分钟无法抓取 {{ $labels.job }} 的指标。
            检查对应 exporter/实例容器状态（docker compose ps）、端口与网络，
            并按 docs/operations.md 5.x 处置；MySQL/Redis 故障会直接影响 /readyz。

  # -------------------------------------------------------------------
  # 运维面自身：/metrics 鉴权失败突增（令牌轮换或暴力探测）
  # -------------------------------------------------------------------
  - name: planstar-ops
    rules:
      - alert: PlanstarOpsAuthFailureSpike
        expr: sum(rate(planstar_ops_auth_failed_total{job="planstar-api"}[5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "planstar-api 运维端点鉴权失败速率超过 1/s"
          description: >-
            9108 运维端点的鉴权失败持续 10 分钟超过 1/s。若刚轮换
            PLANSTAR_OPS_TOKEN，请确认 deploy/prometheus/ops_token 已同步更新；
            否则排查来源 IP 是否存在暴力探测，并检查 planstar_ops_audit_total。
