# =====================================================================
# OpenTelemetry Collector（otel/opentelemetry-collector-contrib:0.110.0）
#
# 应用只向本 collector 发 OTLP（gRPC 4317 / HTTP 4318），由 collector
# 统一批处理后再转发到 Jaeger；8889 暴露 collector 自身指标供 Prometheus 抓取。
# =====================================================================
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # 限制 collector 内存占用，避免突发流量打满容器。
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
  # 5s 批次聚合，降低 Jaeger 写入压力。
  batch:
    timeout: 5s

exporters:
  # Jaeger 1.57 已启用 OTLP 接收端（容器内 4317）。
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  # 便于本地排查：只输出基础摘要，避免逐 span 刷屏。
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger, debug]
  # collector 自身指标（prometheus 抓取 :8889）。
  telemetry:
    metrics:
      address: 0.0.0.0:8889
