entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

# 注意：api.insecure=true 已由 Traefik 内置的 `traefik` entryPoint 占用 :8080，
# 不要再额外声明 address 为 :8080 的 entryPoint，否则端口冲突导致容器反复重启。
api:
  dashboard: true
  insecure: true

providers:
  file:
    filename: /etc/traefik/dynamic.yml

# Let's Encrypt 证书解析器；邮箱与存储由 compose 的 command 注入
# （避免在静态配置里写死敏感邮箱）。