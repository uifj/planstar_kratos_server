http:
  routers:
    # 业务 API：本地/测试用 localhost；生产替换为你真实的域名
    planstar:
      rule: "Host(`localhost`) || Host(`127.0.0.1`)"
      entryPoints: [web]
      middlewares: [compress, security-headers]
      service: planstar

    # 生产 HTTPS：api.planstar.top -> planstar-api:8098
    # 低配档位把 8098 收敛到回环后，外部访问统一经此路由；ACME HTTP-01 由内置路由处理。
    planstar-http:
      rule: "Host(`api.planstar.top`)"
      entryPoints: [web]
      middlewares: [https-redirect, compress]
      service: planstar

    planstar-secure:
      rule: "Host(`api.planstar.top`)"
      entryPoints: [websecure]
      middlewares: [compress, security-headers]
      service: planstar
      tls:
        certResolver: letsencrypt

    # -----------------------------------------------------------------
    # 运营后台：admin.planstar.top
    #   /v1/*  -> admin:9100（HTTP API）
    #   其余   -> admin-web:80（控制台静态资源 + SPA fallback）
    # HTTP 入口统一 301 到 HTTPS；ACME HTTP-01 校验由 Traefik 内置路由优先处理。
    # -----------------------------------------------------------------
    admin-http:
      rule: "Host(`admin.planstar.top`)"
      entryPoints: [web]
      middlewares: [https-redirect, compress]
      service: admin-web

    admin-api:
      rule: "Host(`admin.planstar.top`) && PathPrefix(`/v1`)"
      entryPoints: [websecure]
      middlewares: [compress, security-headers]
      service: admin
      priority: 100
      # 可选：叠加来源 IP 白名单后取消注释。
      # middlewares: [compress, admin-ip-allowlist]
      tls:
        certResolver: letsencrypt

    admin-console:
      rule: "Host(`admin.planstar.top`)"
      entryPoints: [websecure]
      middlewares: [compress, security-headers]
      service: admin-web
      priority: 10
      # middlewares: [compress, admin-ip-allowlist]
      tls:
        certResolver: letsencrypt

    # -----------------------------------------------------------------
    # 【生产安全整改】可观测面板不再暴露到公网 HTTP :80。
    # 旧配置的 grafana/prometheus/jaeger 三条 `web` 路由无 basicAuth、
    # 无 ipAllowList、无 TLS，配合默认 admin/admin 可被任意 Host 头命中，
    # Prometheus 的 --web.enable-lifecycle 还允许无鉴权 /-/reload、/-/quit。
    # 现改为仅通过 compose 中 127.0.0.1 发布的端口 + SSH 隧道访问：
    #   ssh -L 3000:127.0.0.1:3000 -L 9090:127.0.0.1:9090 <user>@<host>
    # 若确需域名访问，必须新建 websecure 路由并叠加 basicAuth + ipAllowList。
    # -----------------------------------------------------------------

  middlewares:
    # 响应压缩，降低 2M 带宽占用（planstar 与 admin 路由共用）。
    compress: {}

    # 统一安全响应头（对齐 OWASP Secure Headers）。
    security-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        forceSTSHeader: true

    # 业务与后台域名全站强制 HTTPS（HTTP-01 challenge 由 Traefik 内置 ACME 路由优先匹配）。
    https-redirect:
      redirectScheme:
        scheme: https
        permanent: true

    # 可选来源白名单：仅在运维出口固定时启用。
    # admin-ip-allowlist:
    #   ipAllowList:
    #     sourceRange:
    #       - "10.0.0.0/8"
    #       - "192.168.0.0/16"

  services:
    planstar:
      loadBalancer:
        servers:
          - url: "http://planstar-api:8098"
    admin:
      loadBalancer:
        servers:
          - url: "http://admin:9100"
    admin-web:
      loadBalancer:
        servers:
          - url: "http://admin-web:80"
    grafana:
      loadBalancer:
        servers:
          - url: "http://grafana:3000"
    prometheus:
      loadBalancer:
        servers:
          - url: "http://prometheus:9090"
    jaeger:
      loadBalancer:
        servers:
          - url: "http://jaeger:16686"