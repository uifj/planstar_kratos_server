# =====================================================================
# Planstar 生产编排（单机单服务器 · 全容器）
# 用法:
#   cp .env.example .env        # 修改口令/镜像目标
#   docker compose up -d --build
# 一键推送部署: ./deploy.sh  （见脚本头部说明）
#
# 可观测栈（对齐仓库 deploy/）:
#   Prometheus + Alertmanager + Grafana + Loki/Promtail + Traefik
#   mysqld-exporter / redis-exporter 基础设施指标
# =====================================================================

name: planstar

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-app-env: &app-env
  PLANSTAR_MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
  PLANSTAR_REDIS_PASSWORD: ${REDIS_PASSWORD:-root}
  PLANSTAR_MQ_ADDR: amqp://${RABBITMQ_USER:-root}:${RABBITMQ_PASS:-root}@rabbitmq:5672/
  # 目录读模型周期全量重建间隔；0 表示只保留启动时一次同步
  PLANSTAR_ES_SYNC_INTERVAL_SECONDS: ${PLANSTAR_ES_SYNC_INTERVAL_SECONDS:-300}
  # 9108 运维端点鉴权令牌（/metrics 需要 Bearer；为空则 /metrics 返回 401）
  PLANSTAR_OPS_TOKEN: ${PLANSTAR_OPS_TOKEN:-}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次初始化：建库建表 -> 演示数据 -> 认证支撑 -> 生产化补丁（按文件名字典序）
      - ../docs/sql/00_all.sql:/docker-entrypoint-initdb.d/00_all.sql:ro
      - ../docs/sql/14_mock_seed.sql:/docker-entrypoint-initdb.d/14_mock_seed.sql:ro
      - ./sql/15_auth_support.sql:/docker-entrypoint-initdb.d/15_auth_support.sql:ro
      - ./sql/16_production_hardening.sql:/docker-entrypoint-initdb.d/16_production_hardening.sql:ro
      - ./sql/17_pay_refund_chat.sql:/docker-entrypoint-initdb.d/17_pay_refund_chat.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    logging: *default-logging
    networks: [planstar]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-root}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-root}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    logging: *default-logging
    networks: [planstar]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-root}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-root}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - mq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging: *default-logging
    networks: [planstar]

  elasticsearch:
    image: elasticsearch:7.17.22
    restart: unless-stopped
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: "false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    logging: *default-logging
    networks: [planstar]

  consul:
    image: hashicorp/consul:1.19.1
    restart: unless-stopped
    command: ["agent", "-server", "-bootstrap-expect=1", "-ui", "-client=0.0.0.0", "-bind=0.0.0.0"]
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    volumes:
      - consul_data:/consul/data
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *default-logging
    networks: [planstar]

  jaeger:
    image: jaegertracing/all-in-one:1.57
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      # 仅暴露 UI；OTLP 接收统一由 otel-collector 承担，避免与 4317/4318 端口冲突
      - "16686:16686"
    logging: *default-logging
    networks: [planstar]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      # OTLP 接收端只在宿主机回环暴露，供本机调试；容器间走 planstar 网络
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    depends_on:
      - jaeger
    logging: *default-logging
    networks: [planstar]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./deploy/alertmanager/entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
    environment:
      # 通知渠道凭据全部由 .env 注入，配置文件中只保留 AM_* 占位
      AM_SMTP_SMARTHOST: ${AM_SMTP_SMARTHOST:-}
      AM_SMTP_FROM: ${AM_SMTP_FROM:-}
      AM_SMTP_AUTH_USERNAME: ${AM_SMTP_AUTH_USERNAME:-}
      AM_SMTP_AUTH_PASSWORD: ${AM_SMTP_AUTH_PASSWORD:-}
      AM_ALERT_EMAIL_TO: ${AM_ALERT_EMAIL_TO:-}
    # Alertmanager 不支持 --config.expand-env（那是 Prometheus 的参数），
    # 由 entrypoint.sh 把模板中的 AM_* 占位渲染到 /tmp 后再启动。
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    command:
      - --storage.path=/alertmanager
    logging: *default-logging
    networks: [planstar]

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    restart: unless-stopped
    environment:
      # v0.15 起不再读取 DATA_SOURCE_NAME，改用 --mysqld.* 参数 + 该环境变量传口令
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=root
    ports:
      - "9104:9104"
    depends_on:
      mysql:
        condition: service_healthy
    logging: *default-logging
    networks: [planstar]

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0-alpine
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-root}
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging
    networks: [planstar]

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules:/etc/prometheus/rules:ro
      # 抓取 9108/metrics 的 Bearer 令牌；deploy.sh 从 $PLANSTAR_OPS_TOKEN 写入
      - ./deploy/prometheus/ops_token:/etc/prometheus/ops_token:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    depends_on:
      - alertmanager
      - mysqld-exporter
      - redis-exporter
    logging: *default-logging
    networks: [planstar]

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    logging: *default-logging
    networks: [planstar]

  loki:
    image: grafana/loki:3.1.0
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./deploy/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    logging: *default-logging
    networks: [planstar]

  promtail:
    image: grafana/promtail:3.1.0
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./deploy/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - loki
    logging: *default-logging
    networks: [planstar]

  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./deploy/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./deploy/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - acme_data:/acme
    command:
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-ops@example.com}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    depends_on:
      - planstar-api
      - grafana
      - prometheus
      - jaeger
    logging: *default-logging
    networks: [planstar]

  planstar-api:
    image: ${PLANSTAR_IMAGE:-ghcr.io/uifj/planstar-api}:${PLANSTAR_TAG:-latest}
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    init: true
    environment:
      <<: *app-env
      TZ: Asia/Shanghai
    ports:
      - "8098:8098"
      # 运维端口仅绑定本机回环，生产通过内网/跳板机访问，不直接暴露公网
      - "127.0.0.1:9108:9108"
    volumes:
      - ./configs/config.prod.yaml:/data/conf/config.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9108/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      consul:
        condition: service_healthy
      jaeger:
        condition: service_started
    logging: *default-logging
    networks: [planstar]

volumes:
  mysql_data:
  redis_data:
  mq_data:
  es_data:
  consul_data:
  prometheus_data:
  grafana_data:
  loki_data:
  acme_data:

networks:
  planstar:
    driver: bridge