server:
  http:
    addr: 0.0.0.0:8098
  # 运维端口：/metrics（Prometheus）、/healthz、/readyz
  admin:
    addr: 0.0.0.0:9108

data:
  mysql:
    addr: host.docker.internal:3306
    user: root
    password: root
    charset: utf8mb4
  redis:
    addr: host.docker.internal:6379
    password: root
    db: 0
  elastic:
    addr: http://host.docker.internal:9200
    index_prefix: planstar
    sync_interval_seconds: 300
    request_timeout_seconds: 3

# 会话有效期（天）
auth:
  session_expire_days: 30

# Jaeger 链路追踪（留空则关闭 tracing）
trace:
  endpoint: http://host.docker.internal:14268/api/traces
  env: docker
  sample_ratio: 1.0

# RabbitMQ 异步事件
mq:
  addr: amqp://root:root@host.docker.internal:5672/
  exchange: planstar.exchange
  queue: planstar.api.events

# Consul 服务注册（address 留空则不注册）
registry:
  consul:
    address: host.docker.internal:8500
    scheme: http
    service_host: host.docker.internal
