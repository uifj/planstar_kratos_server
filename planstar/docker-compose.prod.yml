# =====================================================================
# Planstar 生产上线版本叠加文件（4 核 8G / 2M 带宽单机）
#
#   cp .env.prod.example .env.prod   # 逐项填写，禁止保留 <REPLACE_ME>
#   ./deploy/preflight.sh            # 发布前强制校验
#   docker compose --env-file .env.prod \
#     -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# 与本地版本的本质差异：
#   * PLANSTAR_ENV=prod，auth.allow_test_credentials=false（conf.Validate 强制）
#   * 14_mock_seed.sql 被 14_noop.sql 覆盖 → 零演示业务数据
#   * 追加 21_disable_test_accounts.sql → 演示账号口令清空并停用
#   * 追加 22_create_app_user.sh → 应用改用最小权限 DB 账号（禁 root）
#   * 所有口令/密钥用 ${VAR:?} 强制注入，缺失即 compose 解析失败
#   * 生产强制接入已购买的阿里云短信 + OSS
#   * 内网组件端口仅绑 127.0.0.1，公网只保留 Traefik 80/443
#
# 依据：Docker Compose 官方 Merge 文档 —— volumes 按容器路径覆盖，
#       environment 按键覆盖，command/mem_limit/cpus 单值替换。
# =====================================================================

name: planstar

services:
  mysql:
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?生产必须设置 MYSQL_ROOT_PASSWORD}
      PLANSTAR_APP_DB_USER: ${PLANSTAR_APP_DB_USER:-planstar_app}
      PLANSTAR_APP_DB_PASSWORD: ${PLANSTAR_APP_DB_PASSWORD:?生产必须设置 PLANSTAR_APP_DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 4C8G 多服务共驻：不可照搬官方「专用服务器 80% 内存」建议
      - --innodb-buffer-pool-size=1G
      - --max-connections=150
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      # 同名容器路径覆盖 base 的演示种子挂载；生产不加载任何 demo 数据
      - ./sql/14_noop.sql:/docker-entrypoint-initdb.d/14_mock_seed.sql:ro
      # 生产专属：禁用测试口令 + 创建最小权限应用账号
      - ./sql/21_disable_test_accounts.sql:/docker-entrypoint-initdb.d/21_disable_test_accounts.sql:ro
      - ./sql/22_create_app_user.sh:/docker-entrypoint-initdb.d/22_create_app_user.sh:ro
    mem_limit: 2g
    cpus: 1.5

  redis:
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?生产必须设置 REDIS_PASSWORD}
      - --maxmemory
      - 384mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: 512m
    cpus: 0.5

  planstar-api:
    environment:
      PLANSTAR_ENV: prod
      # 【生产禁用测试口令】应用层 conf.Validate() 与启动断言双重校验
      PLANSTAR_AUTH_ALLOW_TEST_CREDENTIALS: "false"
      PLANSTAR_AUTH_CODE_HMAC_KEY: ${PLANSTAR_AUTH_CODE_HMAC_KEY:?生产必须设置验证码摘要密钥}
      # 最小权限 DB 账号；conf.Validate() 拒绝 root
      PLANSTAR_MYSQL_USER: ${PLANSTAR_APP_DB_USER:-planstar_app}
      PLANSTAR_MYSQL_PASSWORD: ${PLANSTAR_APP_DB_PASSWORD:?}
      PLANSTAR_REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      # 运维端点：非空令牌 + 非空来源白名单，缺失即启动失败
      PLANSTAR_OPS_TOKEN: ${PLANSTAR_OPS_TOKEN:?生产必须设置运维令牌}
      PLANSTAR_OPS_ALLOWED_CIDRS: ${PLANSTAR_OPS_ALLOWED_CIDRS:?生产必须设置运维来源白名单}
      # 4C8G/2M 带宽：关闭 ES / MQ / Consul / tracing，搜索降级 MySQL
      PLANSTAR_CONFIG_FILE: config.lite.yaml
      PLANSTAR_MQ_ADDR: ""
      PLANSTAR_ES_ADDR: ""
      PLANSTAR_CONSUL_ADDRESS: ""
      PLANSTAR_TRACE_ENDPOINT: ""
      # 已购买的阿里云短信（生产唯一允许的验证码通道）
      PLANSTAR_NOTIFY_SMS_ENABLED: "true"
      PLANSTAR_NOTIFY_SMS_PROVIDER: aliyun
      PLANSTAR_NOTIFY_SMS_ENDPOINT: ${PLANSTAR_NOTIFY_SMS_ENDPOINT:-dypnsapi.aliyuncs.com}
      PLANSTAR_NOTIFY_SMS_ACCESS_KEY: ${PLANSTAR_NOTIFY_SMS_ACCESS_KEY:?}
      PLANSTAR_NOTIFY_SMS_ACCESS_SECRET: ${PLANSTAR_NOTIFY_SMS_ACCESS_SECRET:?}
      PLANSTAR_NOTIFY_SMS_SIGN_NAME: ${PLANSTAR_NOTIFY_SMS_SIGN_NAME:?}
      PLANSTAR_NOTIFY_SMS_TEMPLATE_CODE: ${PLANSTAR_NOTIFY_SMS_TEMPLATE_CODE:?}
      # 已购买的阿里云 OSS
      PLANSTAR_STORAGE_OSS_ENABLED: "true"
      PLANSTAR_STORAGE_OSS_PROVIDER: aliyun
      PLANSTAR_STORAGE_OSS_ENDPOINT: ${PLANSTAR_STORAGE_OSS_ENDPOINT:?}
      PLANSTAR_STORAGE_OSS_REGION: ${PLANSTAR_STORAGE_OSS_REGION:?}
      PLANSTAR_STORAGE_OSS_BUCKET: ${PLANSTAR_STORAGE_OSS_BUCKET:?}
      PLANSTAR_STORAGE_OSS_ACCESS_KEY: ${PLANSTAR_STORAGE_OSS_ACCESS_KEY:?}
      PLANSTAR_STORAGE_OSS_ACCESS_SECRET: ${PLANSTAR_STORAGE_OSS_ACCESS_SECRET:?}
      PLANSTAR_STORAGE_OSS_CDN_HOST: ${PLANSTAR_STORAGE_OSS_CDN_HOST:-}
      PLANSTAR_STORAGE_OSS_PRESIGN_TTL_SECONDS: "900"
    volumes:
      - ./configs/config.lite.yaml:/data/conf/config.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 1g
    cpus: 1.5

  admin:
    environment:
      ADMIN_DATA_DATABASE_SOURCE: ${ADMIN_DATA_DATABASE_SOURCE:?}
      ADMIN_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      ADMIN_AUTH_JWT_SECRET: ${ADMIN_AUTH_JWT_SECRET:?}
      ADMIN_PLANSTAR_OPS_TOKEN: ${PLANSTAR_OPS_TOKEN:?}
      ADMIN_AUTH_COOKIE_SECURE: "true"
    mem_limit: 512m
    cpus: 0.5

  grafana:
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?生产必须设置 Grafana 口令}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 384m
    cpus: 0.25

  mysqld-exporter:
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}

  redis-exporter:
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}

  prometheus:
    # 去掉 --web.enable-lifecycle：无鉴权的 /-/reload、/-/quit 可被远程调用
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 768m
    cpus: 0.5

  traefik:
    # 服务器版已升级 v3.6 并启用 Docker Provider；证书改走 DNS Challenge
    image: traefik:v3.6
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # 火山引擎 DNS API 密钥（dnsChallenge 申请证书用；从 .env.prod 注入）
      VOLC_ACCESSKEY: ${VOLC_ACCESSKEY:?生产必须设置 VOLC_ACCESSKEY}
      VOLC_SECRETKEY: ${VOLC_SECRETKEY:?生产必须设置 VOLC_SECRETKEY}
    # ACME 参数已迁移到 deploy/traefik/traefik.yml（dnsChallenge），
    # 这里清空 base 的命令行 httpchallenge 参数
    command: []
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8080:8080"
    mem_limit: 256m
    cpus: 0.5
