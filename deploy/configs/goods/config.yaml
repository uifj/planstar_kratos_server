server:
  grpc:
    addr: 0.0.0.0:50052
    timeout: 1s
data:
  database:
    driver: mysql
    source: root:root@tcp(mysql:3306)/shop_goods?parseTime=true&charset=utf8mb4&loc=Local
  redis:
    addr: redis:6379
    password: root
    dial_timeout: 1s
    read_timeout: 0.2s
    write_timeout: 0.2s
  elastic:
    addr: http://elasticsearch:9200
trace:
  endpoint: http://jaeger:14268/api/traces
mq:
  addr: amqp://root:root@rabbitmq:5672/
service:
  inventory:
    endpoint: discovery:///shop.inventory.service
